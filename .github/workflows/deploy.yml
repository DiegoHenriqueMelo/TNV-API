name: Deploy to Hostinger VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e

            if [ ! -d /root/apps/TNV-API.git ]; then
              echo "Repository not found. Cloning for first deploy..."
              git clone --branch main https://github.com/DiegoHenriqueMelo/TNV-API.git /opt/tnv-api
            fi

            cd /opt/tnv-api

            if [ ! -f .env ]; then
              echo "ERROR: /root/apps/TNV-API.env not found. Create it on the server before deploying."
              exit 1
            fi

            echo "Pulling latest changes..."
            git checkout main
            git pull origin main

            echo "Rebuilding and restarting containers..."
            docker compose up -d --build --remove-orphans

            echo "Removing unused images..."
            docker image prune -f

            echo "Deploy completed successfully!"
