name: Deploy to Staging VM (develop)

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Staging VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT }}
          script: |
            set -e

            cd /opt/tnv-api-staging

            echo "Pulling latest changes from develop..."
            git pull origin develop

            echo "Rebuilding and restarting containers..."
            docker compose up -d --build --remove-orphans

            echo "Waiting for API to be healthy..."
            sleep 10

            echo "Deploy to staging completed!"

  integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Wait for API to be ready
        run: |
          echo "Waiting for staging API..."
          for i in $(seq 1 15); do
            if curl -sf http://${{ secrets.STAGING_SSH_HOST }}:4000/health; then
              echo "API is up!"
              break
            fi
            echo "Attempt $i/15 - waiting 5s..."
            sleep 5
          done

      - name: Run integration tests
        run: npm run test:integration
        env:
          API_BASE_URL: http://${{ secrets.STAGING_SSH_HOST }}:4000
          NODE_ENV: test
