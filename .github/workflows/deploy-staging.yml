name: Deploy to VM (develop)

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e

            if [ ! -d /root/apps/TNV-API/.git ]; then
              echo "Repository not found. Cloning for first deploy..."
              git clone --branch develop https://github.com/DiegoHenriqueMelo/TNV-API.git /root/apps/TNV-API
            fi

            cd /root/apps/TNV-API

            if [ ! -f .env ]; then
              echo "ERROR: /root/apps/TNV-API/.env not found. Create it on the server before deploying."
              exit 1
            fi

            echo "Pulling latest changes from develop..."
            git checkout develop
            git pull origin develop

            echo "Rebuilding and restarting containers..."
            docker compose up -d --build --remove-orphans

            echo "Removing unused images..."
            docker image prune -f

            echo "Deploy completed!"
